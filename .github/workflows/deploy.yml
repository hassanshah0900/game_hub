name: Game Hub Deployment
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Game Hub
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image
        run: docker image build -t game-hub .

      - name: Tag Image
        run: docker image tag game-hub ${{vars.DOCKER_HUB_USERNAME}}/game-hub

      - name: Push Image
        run: docker image push ${{vars.DOCKER_HUB_USERNAME}}/game-hub

      - name: Login to VPS using SSH key and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo docker image pull syedhassanshah/game-hub
            sudo docker container run -d --name game-hub-container -p 3000:4173 syedhassanshah/game-hub
